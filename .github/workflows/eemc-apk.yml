name: Build EEMC Native Formula Pro APK

on:
  push:
    branches: [eemc-native-pro]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle -p eemc-android assembleDebug --stacktrace
      - name: Rename APK
        run: cp eemc-android/app/build/outputs/apk/debug/app-debug.apk EEMC-v4.0-Native-Formula-Pro.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EEMC-v4.0-Native-Formula-Pro-APK
          path: EEMC-v4.0-Native-Formula-Pro.apk
